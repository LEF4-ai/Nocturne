<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nocturne">
<meta name="description" content="On ne tue pas ses démons, on les apprivoise.">
<title>NOCTURNE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E0B10; --plum:#241629; --plum2:#2e1d34; --line:#3d2a45;
  --blood:#7A1430; --gold:#C9A45C; --moon:#ECE6DA; --verdi:#6FBFB0; --ash:#8C8391;
  --goth:'Pirata One','UnifrakturMaguntia',serif;
  --serif:'Cormorant Garamond',Georgia,serif;
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--moon);font-family:var(--ui);font-size:16px;line-height:1.45}
body{min-height:100dvh;background:
  radial-gradient(120% 60% at 50% -10%,#2a1730 0%,transparent 60%),
  radial-gradient(100% 40% at 50% 110%,#16232a 0%,transparent 70%),var(--ink);background-attachment:fixed}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
button{font:inherit;color:inherit}
.screen{padding:12px 18px 110px}
.onb .screen{padding-bottom:40px}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:linear-gradient(var(--ink) 70%,transparent)}
.brand{font-family:var(--goth);font-size:22px;letter-spacing:.06em;color:var(--moon);opacity:.9}
.talk{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--plum);font-size:13px;font-weight:600;cursor:pointer}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(14,11,16,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{min-height:62px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ash);cursor:pointer}
.nav button.on{color:var(--moon)}
.nav svg{width:22px;height:22px}

/* type */
h1,h2,h3,.goth{font-family:var(--goth);font-weight:400;letter-spacing:.02em;margin:0}
h1{font-size:44px;line-height:1}
h2{font-size:30px;line-height:1.1;margin:8px 0 6px}
h3{font-size:22px;margin:0 0 4px}
p{margin:8px 0}
.muted{color:var(--ash)}
.small{font-size:13px}
.center{text-align:center}
.her{font-family:var(--serif);color:var(--gold);font-size:21px;line-height:1.3;font-weight:600}
.dv{font-family:var(--serif);font-style:italic;color:var(--verdi);font-size:22px;line-height:1.3;display:inline-block;animation:tremble .34s steps(2) infinite}
.dname{color:var(--verdi)}
.gold{color:var(--gold)}
@keyframes tremble{0%,100%{transform:translate(0,0)}25%{transform:translate(.5px,-.4px)}50%{transform:translate(-.4px,.5px)}75%{transform:translate(.4px,.3px)}}

/* surfaces */
.card{background:var(--plum);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.gold{border-color:rgba(201,164,92,.45)}
.tarot{position:relative;background:linear-gradient(180deg,#2a1a30,#1c1121);border-radius:14px;padding:14px 12px 12px;border:1px solid #4a3552;outline:1px solid rgba(111,191,176,.25);outline-offset:-6px;text-align:center}
.tarot .num{font-family:var(--serif);font-size:14px;letter-spacing:.2em;color:var(--ash)}
.tarot .tname{font-family:var(--goth);font-size:21px;color:var(--verdi);line-height:1.05;margin-top:4px}
.tarot .tprof{font-size:12px;color:var(--ash)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* buttons */
.btn{min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--plum2);font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.block{display:flex;width:100%;margin:10px 0}
.btn.ghost{background:transparent}
.btn.goldb{border-color:rgba(201,164,92,.6);color:var(--gold)}
.btn.verdi{border-color:rgba(111,191,176,.5);color:var(--verdi)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{min-height:44px;background:none;border:0;color:var(--ash);font-size:14px;padding:0;cursor:pointer}

/* wax seal */
.sealwrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:22px 0 8px}
.seal{width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;position:relative;
  background:radial-gradient(circle at 38% 32%,#a4223f 0%,#7A1430 45%,#4c0a1d 100%);
  box-shadow:0 0 0 5px #5a0e23,0 0 0 7px rgba(201,164,92,.25),0 10px 24px rgba(0,0,0,.6),inset 0 -6px 12px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.seal:active{transform:scale(.93)}
.seal svg{width:44px;height:44px}
.seal-label{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--moon)}
.seal.small{width:72px;height:72px}
.seal.small svg{width:32px;height:32px}

/* chips & inputs */
.chip{min-height:44px;padding:8px 14px;border-radius:22px;border:1px solid var(--line);background:var(--plum);cursor:pointer;font-size:14px}
.chip.on{border-color:var(--gold);color:var(--gold)}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.sw.on{border-color:var(--gold)}
label.lab{display:block;font-size:13px;color:var(--ash);margin:14px 0 6px}
textarea,input[type=text],input[type=search],select{width:100%;background:#170f1b;border:1px solid var(--line);border-radius:12px;color:var(--moon);padding:12px 14px;font-family:var(--serif);font-size:19px;min-height:48px}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid rgba(201,164,92,.5);outline-offset:1px}
select{font-family:var(--ui);font-size:15px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--plum);cursor:pointer;min-height:48px}
.opt.on{border-color:var(--verdi);box-shadow:0 0 0 1px var(--verdi) inset}
.opt .tag{font-family:var(--ui);font-style:normal;font-size:11px;color:var(--ash);display:block;margin-top:2px;letter-spacing:.02em}
.opt .dv{font-size:19px;animation:none}

/* candles */
.cands{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.cand{width:12px;height:26px;position:relative}
.cand i{position:absolute;bottom:0;left:2px;width:8px;height:14px;border-radius:2px;background:#3a2d3f}
.cand b{position:absolute;bottom:14px;left:2px;width:8px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:transparent;border:1px dashed #4a3a50}
.cand.lit i{background:#e9dcc0}
.cand.lit b{border:0;background:radial-gradient(circle at 50% 70%,#fff3c4,#C9A45C 60%,#9a6b20);box-shadow:0 0 10px 2px rgba(201,164,92,.55);animation:flick 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes flick{0%,100%{transform:scaleY(1) rotate(0)}30%{transform:scaleY(1.12) rotate(-3deg)}60%{transform:scaleY(.92) rotate(2deg)}}
.flame{animation:flick 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

/* demon */
.stage{display:flex;justify-content:center;align-items:center;min-height:180px;position:relative}
.stage::after{content:"";position:absolute;bottom:4px;left:15%;right:15%;height:28px;background:radial-gradient(closest-side,rgba(111,191,176,.18),transparent);filter:blur(4px)}
.demon-svg{transition:filter .6s, transform .6s;overflow:visible}
.hit{animation:hit .6s ease-out}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-8px) scale(.96)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}100%{transform:translateX(0)}}
.floaty{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.whisper{text-align:center;margin:6px 6px 14px}

/* spells */
.spells{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.spell{position:relative;min-height:150px;border-radius:14px;border:1px solid rgba(201,164,92,.45);background:linear-gradient(160deg,#2b1a2f,#1a0f1d);padding:12px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s}
.spell:active{transform:translateY(-6px) rotate(-2deg)}
.spell .sn{font-family:var(--serif);font-weight:600;color:var(--gold);font-size:19px;line-height:1.1}
.spell .sd{font-size:12px;color:var(--ash)}
.spell .best{position:absolute;top:8px;right:8px;font-size:10px;color:var(--gold);border:1px solid rgba(201,164,92,.5);border-radius:10px;padding:1px 6px}
.spell.cast{opacity:.45;border-style:dashed}
.spell.cast::after{content:"lancé";position:absolute;bottom:8px;font-size:11px;color:var(--gold);letter-spacing:.1em}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(40px) rotate(4deg) scale(.96)}to{opacity:1;transform:none}}

/* fait/fantome */
.frag{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:#1a111e}
.frag .ft{font-family:var(--serif);font-size:20px;margin-bottom:10px;font-style:italic;color:var(--verdi)}
.frag.fait .ft{color:var(--gold);font-style:normal;font-weight:600}
.frag .row .btn{flex:1}
.frag .btn.sel-fait{border-color:var(--gold);color:var(--gold);background:rgba(201,164,92,.12)}
.frag .btn.sel-fant{border-color:var(--verdi);color:var(--verdi);background:rgba(111,191,176,.1)}
.evap{animation:evap 2.2s ease-in forwards}
@keyframes evap{0%{opacity:1;filter:blur(0);transform:none}100%{opacity:.08;filter:blur(6px);transform:translateY(-18px) scale(1.04);letter-spacing:.08em}}

/* balance */
.bal{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;margin:8px 0}
.bal .v{min-width:56px;text-align:center;font-weight:600}
.bal .btn{min-width:48px;padding:0}
.bar{height:10px;border-radius:5px;background:#1a111e;overflow:hidden;display:flex;margin:10px 0}
.bar span{display:block;height:100%}

/* grimoire */
.page{background:linear-gradient(180deg,#2a1d26,#20151f);border:1px solid rgba(201,164,92,.3);border-radius:4px 14px 14px 4px;padding:14px 14px 10px 18px;margin:12px 0;position:relative}
.page::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:1px;background:rgba(201,164,92,.35)}
.page .meta{font-size:12px;color:var(--ash);display:flex;gap:8px;flex-wrap:wrap}
.page .pt{font-family:var(--serif);color:var(--gold);font-size:20px;font-weight:600;margin:6px 0}
.badge{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.pagepick{cursor:pointer}
.pagepick.on{box-shadow:0 0 0 2px var(--gold)}

/* misc */
.banner{border:1px solid rgba(201,164,92,.4);background:rgba(201,164,92,.06);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.tel{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--moon);background:var(--plum);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;min-height:64px}
.tel b{font-family:var(--ui);font-size:26px;color:var(--gold);min-width:84px}
.breath{width:120px;height:120px;border-radius:50%;margin:20px auto;background:radial-gradient(circle,rgba(201,164,92,.35),rgba(201,164,92,.05) 70%);animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.7)}50%{transform:scale(1.1)}}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:#3a2d3f}
.dots i.on{background:var(--gold);box-shadow:0 0 6px rgba(201,164,92,.6)}
.manor{width:100%;height:auto;display:block}
.manor .room{cursor:pointer}
.manor .room:hover rect.rbg{stroke:#C9A45C}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}
.switch{width:52px;height:30px;border-radius:15px;background:#3a2d3f;border:0;position:relative;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ash);transition:left .2s}
.switch.on{background:var(--blood)}
.switch.on::after{left:25px;background:var(--gold)}
.fade{animation:fade .5s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
hr.orn{border:0;height:14px;margin:18px 0;background:radial-gradient(circle,var(--ash) 1.5px,transparent 2px) center/14px 14px repeat-x;opacity:.5}

.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
.calm .evap{opacity:.3;text-decoration:line-through}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .evap{opacity:.3;text-decoration:line-through}
}
</style>
</head>

<div id="app"></div>
<script>
"use strict";
/* ============================================================
   NOCTURNE — MVP jouable, 100 % local (localStorage)
   ============================================================ */

const TAME_MAX = 8;          // bougies pour apprivoiser un démon
const CRYPT_UNLOCK = 8;      // bougies au total pour ouvrir la Crypte

const ROOMS = [
  {id:'atelier', name:"L’Atelier", dom:"le travail"},

];
const roomName = id => (ROOMS.find(r=>r.id===id)||{}).name || '';

const DEMONS = {
  dentelliere:{num:'I', name:"La Dentellière", profile:"La Perfectionniste",
    desc:"Une araignée couturière qui détricote tout ce qui a un seul défaut.",
    rule:"Tout doit être impeccable.", shame:"Un seul défaut = échec total.",
    whisper:"Un seul défaut et tout est raté.",
    phrases:[
      {t:"Un seul défaut et tout est raté.", f:["Il y a un défaut","donc tout est raté"]},
      {t:"J’ai fait une faute dans mon mail, ils vont croire que je bâcle tout.", f:["J’ai fait une faute dans mon mail","ils vont croire que je bâcle tout"]},
      {t:"Ce n’est pas encore assez bien pour être envoyé.", f:["Je n’ai pas encore envoyé ce travail","il n’est pas assez bien"]},
    ],
    rituals:["Envoyer un travail « à 80 % »","Fixer une heure de fin et s’y tenir","Laisser volontairement une petite imperfection"],
    familiar:{name:"Araignée d’argent", gift:"le sens du détail, mais en laisse"}, best:['fait','soeur']},
  liche:{num:'II', name:"La Liche des Savoirs", profile:"L’Experte",
    desc:"Une bibliothécaire squelette qui exige toujours un diplôme de plus.",

      {t:"Si on me pose une question et que je ne sais pas, je suis démasquée.", f:["On pourrait me poser une question dont je ne connais pas la réponse","si je ne sais pas, je suis démasquée"]},

    ],
    rituals:["Dire « je ne sais pas, je vais vérifier »","Postuler sans cocher 100 % des critères","Partager ce que tu sais déjà"],

  miroir:{num:'III', g:'m', name:"Le Miroir Fêlé", profile:"Le Génie naturel",

    phrases:[

    ],
    rituals:["Commencer un truc difficile et noter ce que tu as appris, pas le résultat","Montrer un brouillon à quelqu’un","Écrire une chose que tu sais faire aujourd’hui et pas il y a un an"],
    familiar:{name:"Éclat de miroir", gift:"un regard neuf sur ta progression"}, best:['soeur','balance']},
  gargouille:{num:'IV', name:"La Gargouille Recluse", profile:"La Soliste",
    desc:"Une statue qui mure les portes du Manoir.",
    rule:"Je dois y arriver seule.", shame:"Avoir besoin d’aide.",
    whisper:"Si tu demandes de l’aide, ils verront que tu es une fraude.",
    phrases:[
      {t:"Si tu demandes de l’aide, ils verront que tu es une fraude.", f:["J’ai besoin d’aide sur ce dossier","si je demande, ils verront que je suis une fraude"]},
      {t:"Je dois y arriver seule, sinon ça ne compte pas.", f:["J’ai reçu de l’aide sur ce projet","donc la réussite ne compte pas"]},
      {t:"Je vais déranger tout le monde avec ma question.", f:["J’ai une question","je vais déranger tout le monde"]},

    rituals:["Demander de l’aide à une personne","Accepter une aide proposée","Dire qui t’a aidée, sans te diminuer"],

  hydre:{num:'V', name:"L’Hydre aux Mille Bras", profile:"La Superwoman",

    ],
    rituals:["Dire non à une demande","Déléguer une tâche","20 minutes de pause sans rien produire"],
    familiar:{name:"Serpent à une tête", gift:"l’énergie choisie"}, best:['fait','soeur']},
  chuchoteuses:{num:'VI', g:'pl', name:"Les Chuchoteuses", profile:"La disqualification du succès",

    phrases:[

    rituals:["Recevoir un compliment et dire seulement « merci »","Écrire un compliment reçu dans le Grimoire le soir même","Relire trois pages du Grimoire avant de dormir"],

};
const voc = d => d.name.replace(/^(La |Le |Les |L’)/,'');
const mid = d => d.name.replace(/^(La|Le|Les|L’)/, m=>m.toLowerCase());
const V = (d,f,m,p) => d && d.g==='pl' ? p : d && d.g==='m' ? (m ?? f) : f;

const KEY = 'nocturne.v1';
function blank(){
  return {v:1, profile:null,
    demons:Object.fromEntries(ORDER.map(id=>[id,{tame:0,phrases:[],familiar:false}])),
    rooms:{atelier:0,bibliotheque:0,salon:0,tour:0,crypte:0},
    vigils:[], rituals:[], proofs:[], spectre:0, lastSeen:null,
    settings:{vibrate:true, calm:false}};
}
function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && r.v===1){ const b=blank();
      return {...b,...r, demons:{...b.demons,...r.demons}, rooms:{...b.rooms,...r.rooms}, settings:{...b.settings,...r.settings}}; }
  }catch(e){}
  return blank();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,"'");

const totalCandles = () => Object.values(S.rooms).reduce((a,b)=>a+b,0);

function isDistress(...txts){ const t = norm(txts.join(' ')); return DISTRESS.some(w=>t.includes(w)); }

function demonSVG(id, o={}){
  const {size=170, familiar=false, shrink=0, cls=''} = o;
  const d = S.demons[id]; const tame = o.tame ?? (d ? d.tame : 0);
  const eye = (S.profile&&S.profile.eye) || '#6FBFB0', hair = (S.profile&&S.profile.hairColor) || '#2a2030';
  const sc = familiar ? .66 : Math.max(.42, 1 - (tame/TAME_MAX)*.35 - shrink);
  const blur = familiar ? 0 : Math.max(0, 2.4 - tame*.28 - shrink*5);
  const col = (id==='spectre'||id==='ouroboros') ? '#8C8391' : '#6FBFB0';
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" class="demon-svg ${cls}" style="filter:${blur>0?`blur(${blur.toFixed(2)}px)`:'none'}" aria-hidden="true"><g transform="translate(100 105) scale(${sc.toFixed(3)}) translate(-100 -105)">${DRAW[id](col,eye,hair,familiar)}</g></svg>`;
}

function manorSVG(){
  const R = S.rooms, tot = totalCandles(), open = cryptOpen();
  const room = (id,x,y,w,h) => {
    const n = R[id]||0, locked = id==='crypte' && !open;
    const glow = Math.min(.55, n*.07);
    const max = Math.max(1, Math.floor((w-16)/11));
    let c=''; for(let i=0;i<Math.min(n,max);i++){ const cx=x+12+i*11; c+=`<rect x="${cx-2}" y="${y+h-13}" width="4" height="8" fill="#e9dcc0"/><ellipse class="flame" style="animation-delay:${(i*.37)%1.8}s" cx="${cx}" cy="${y+h-16.5}" rx="2.3" ry="3.6" fill="#C9A45C"/>`; }
    if(n>max) c+=`<text x="${x+w-8}" y="${y+h-7}" text-anchor="end" font-size="9" fill="#C9A45C" font-family="Inter">+${n-max}</text>`;
    const label = ROOMS.find(r=>r.id===id).name;
    return `<g class="room" ${locked?'data-a="lockedCrypt"':`data-a="vigil" data-room="${id}"`} role="button" aria-label="${esc(label)}${locked?' (scellée)':''}">
      <rect class="rbg" x="${x}" y="${y}" width="${w}" height="${h}" fill="#120c15" stroke="#3d2a45" stroke-width="1.2"/>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#roomglow)" opacity="${glow}"/>
      <path d="M${x+w/2-9} ${y+h-4} v-${h*.42} a9 9 0 0 1 18 0 v${h*.42}" fill="none" stroke="#2b1e31" stroke-width="1.2"/>
      ${c}
      <text x="${x+w/2}" y="${y+16}" text-anchor="middle" font-size="11" fill="${locked?'#5b5060':'#ECE6DA'}" font-family="Cormorant Garamond, serif" font-weight="600">${esc(label)}</text>

function newVigil(room){ return {step: room?'worry':'room', room, worry:'', typed:'', pick:null, demon:null, named:false, cast:[], spell:null, ff:null, rewrite:'', proofId:null, proofText:'', bal:null, balText:'', balSave:true, facts:'', ritualCustom:'', spectre:false}; }
function thoughtOf(v){ return (v.typed.trim() || (v.pick&&v.pick.t) || '').trim(); }
function splitThought(t){
  let parts = t.split(/(?<=[,;:.!?…])\s+|\s+(?=(?:et|mais|donc|alors|parce que|parce qu|car|sinon|puisque|du coup|comme)\s)/i)
    .map(s=>s.replace(/^[,;:\s]+|[,;:\s]+$/g,'').trim()).filter(s=>s.length>1);
  if(parts.length<2){ const m = t.split(/\s+(?=(?:que|qu’|qu')\s?)/i).filter(s=>s.trim().length>1); if(m.length>1) parts=m.map(s=>s.trim()); }
  return parts.length?parts:[t];
}
function fragmentsOf(v){ return (!v.typed.trim() && v.pick && v.pick.f) ? v.pick.f : splitThought(thoughtOf(v)); }

function spellScreen(v,d){
  const k = v.spell, s = SPELLS[k];
  const anim = ui.spellAnim; ui.spellAnim = false;
  const head = `<button class="back" data-a="vstep" data-s="duel">← Reposer la carte</button>
    <div class="center ${anim?'enter':''}">${GLYPH_SVG(s.glyph,40)}<h2 class="gold" style="font-family:var(--serif);font-weight:600">${s.name}</h2></div>`;
  if(k==='fait'){
    const fr = fragmentsOf(v), ff = v.ff || (v.ff={sorted:{},done:false});
    const all = fr.every((_,i)=>ff.sorted[i]);
    if(ff.done){
      const facts = fr.filter((_,i)=>ff.sorted[i]==='fait');
      return `${head}
      ${fr.map((t,i)=>`<div class="frag ${ff.sorted[i]==='fait'?'fait':'evap'}"><div class="ft" style="margin:0">${esc(t)}</div></div>`).join('')}
      <div class="card gold fade"><p class="her" style="margin:0">${facts.length?`Les fantômes s’évaporent. Il reste ${facts.length>1?'ces faits':'ce fait'} : ${facts.map(esc).join(' ; ')}. Rien de plus.`:'Tout était fantôme. Il ne reste rien à quoi obéir.'}</p></div>
      <button class="btn block goldb" data-a="castDone" data-k="fait">Retour au duel</button>`;
    }
    return `${head}
    <p class="muted">Un <span class="gold">fait</span>, c’est ce qu’une caméra aurait pu filmer. Un <span class="dname">fantôme</span>, c’est une interprétation, une prédiction, un jugement.</p>
    ${fr.map((t,i)=>`<div class="frag"><div class="ft">${esc(t)}</div><div class="row">
      <button class="btn ${ff.sorted[i]==='fait'?'sel-fait':''}" data-a="ffSort" data-i="${i}" data-v="fait">Fait</button>
      <button class="btn ${ff.sorted[i]==='fantome'?'sel-fant':''}" data-a="ffSort" data-i="${i}" data-v="fantome">Fantôme</button></div></div>`).join('')}
    <button class="btn block goldb" data-a="ffCast" ${all?'':'disabled'}>Lancer le sort</button>`;
  }
  if(k==='soeur'){
    if(v.soeurDone) return `${head}<div class="card gold fade"><p class="small muted" style="margin-top:0">Ta voix, ce soir :</p><p class="her" style="margin:0">${esc(v.rewrite)}</p></div>

      <button class="btn block goldb" data-a="castDone" data-k="soeur">Retour au duel</button>`;
    return `${head}
    <p class="center"><span class="dv">« ${esc(thoughtOf(v))} »</span></p>
    <p>Si ta meilleure amie te disait ça d’elle-même, <span class="gold">que lui répondrais-tu ?</span> Réécris la phrase avec cette voix-là.</p>
    <div class="row" style="margin-bottom:8px">
      <button class="chip" data-a="starter" data-t="Beaucoup de gens ressentent ça, surtout quand ">Humanité commune</button>
      <button class="chip" data-a="starter" data-t="Tu fais de ton mieux, et ">Bienveillance</button>
      <button class="chip" data-a="starter" data-t="C’est une pensée difficile, pas un fait. ">Pleine conscience</button>
    </div>
    <textarea id="rw" data-bind="v.rewrite" placeholder="Hé, ma belle…">${esc(v.rewrite)}</textarea>
    <button class="btn block goldb" data-a="soeurCast">Lancer le sort</button>`;
  }
  if(k==='miroir'){
    if(v.miroirDone){ const p = S.proofs.find(x=>x.id===v.proofId);
      return `${head}<div class="page fade"><div class="meta"><span>${fmt(p.date)}</span><span class="badge">${p.type}</span></div><div class="pt">${esc(p.text)}</div></div>
      <p class="center"><span class="dv" style="font-size:18px">${d.name} ${V(d,'détourne',null,'détournent')} les yeux.</span></p>
      <button class="btn block goldb" data-a="castDone" data-k="miroir">Retour au duel</button>`; }
    const list = [...S.proofs].reverse().slice(0,30);
    return `${head}
    <p class="muted">Invoque une page du Grimoire qui contredit ${mid(d)}.</p>
    ${list.length?list.map(p=>`<div class="page pagepick ${v.proofId===p.id?'on':''}" data-a="pickProof" data-id="${p.id}" role="button"><div class="meta"><span>${fmt(p.date)}</span><span class="badge">${p.type}</span>${p.room?`<span>${roomName(p.room)}</span>`:''}</div><div class="pt">${esc(p.text)}</div></div>`).join(''):
      `<div class="card"><p style="margin:0">Ton Grimoire est encore vide. Écris ta première preuve : une chose réussie, un compliment reçu, un retour positif. Même petite.</p></div>`}
    <label class="lab">${list.length?'Ou écris une nouvelle preuve':'Ta première preuve'}</label>
    <textarea data-bind="v.proofText" placeholder="J’ai mené la réunion de lundi et on a pris une décision.">${esc(v.proofText)}</textarea>
    <button class="btn block goldb" data-a="miroirCast">Invoquer la preuve</button>`;
  }
  if(k==='balance'){
    const b = v.bal || (v.bal={chance:25,aide:25,effort:25,comp:25});
    const tot = b.chance+b.aide+b.effort+b.comp, me = b.effort+b.comp;
    const rows = [['chance','La chance','#8C8391'],['aide','L’aide des autres','#6FBFB0'],['effort','Mon effort','#a8853f'],['comp','Ma compétence','#C9A45C']];
    if(v.balDone) return `${head}
      <div class="bar">${rows.map(([k,,c])=>`<span style="width:${b[k]}%;background:${c}"></span>`).join('')}</div>
      <div class="card gold fade"><p class="her" style="margin:0">${me>=40?`${me} % de ce succès vient de toi. C’est réel, et ${mid(d)} ${V(d,'perd',null,'perdent')} des forces.`:`Regarde encore : qui a choisi, préparé, osé ? Une part de ce succès est à toi, même si ${mid(d)} ${V(d,'ricane',null,'ricanent')}.`}</p></div>
      <button class="btn block goldb" data-a="castDone" data-k="balance">Retour au duel</button>`;
    return `${head}
    <p class="muted">Pense à un succès récent, même petit. Répartis 100 % entre ses vraies causes.</p>
    <input type="text" data-bind="v.balText" value="${esc(v.balText)}" placeholder="Le succès : j’ai eu mon partiel, j’ai livré le projet…">
    <div class="bar">${rows.map(([k,,c])=>`<span style="width:${b[k]}%;background:${c}"></span>`).join('')}</div>
    ${rows.map(([k,l,c])=>`<div class="bal"><span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:8px"></span>${l}</span>
      <button class="btn" data-a="bal" data-k="${k}" data-d="-10" aria-label="moins">−</button><span class="v">${b[k]} %</span><button class="btn" data-a="bal" data-k="${k}" data-d="10" aria-label="plus" ${tot>=100?'disabled':''}>+</button></div>`).join('')}
    <p class="small ${tot===100?'gold':'muted'} center">${tot===100?'La balance est équilibrée.':`Il reste ${100-tot} % à placer.`}</p>
    <label class="row small" style="margin:10px 0;min-height:44px"><input type="checkbox" data-bind="v.balSave" ${v.balSave?'checked':''} style="width:22px;height:22px"> Inscrire ce succès dans le Grimoire</label>
    <button class="btn block goldb" data-a="balCast" ${tot===100?'':'disabled'}>Lancer le sort</button>`;
  }
  return head;
}

/* ============================================================
   ACTIONS
   ============================================================ */
const A = {};
A.go = ({to}) => go(to);
A.goBack = () => go(ui.prev && ui.prev!=='help' ? ui.prev : (S.profile?'home':'welcome'));
A.startOnb = () => { ui.draft = defaultDraft(); ui.editing=false; go('profile'); };
A.draft = ({k,v}) => { ui.draft[k] = v==='true'?true:v==='false'?false:v; rerender(); };
A.saveDraft = () => {
  ui.draft.name = (ui.draft.name||'').trim() || 'Morgane';
  if(ui.editing){ S.profile = {...S.profile, ...ui.draft}; save(); ui.editing=false; go('me'); }
  else { ui.q = {i:0, ans:[]}; go('quiz'); }
};
A.answer = ({v}) => {
  ui.q.ans[ui.q.i] = +v; ui.q.i++;
  if(ui.q.i >= QUIZ.length){
    const sc = Object.fromEntries(YOUNG.map(id=>[id,0]));
    QUIZ.forEach((q,i)=> sc[q.d] += ui.q.ans[i]||0);
    ui.result = [...YOUNG].sort((a,b)=>sc[b]-sc[a]).slice(0,2);
    go('quizResult');
  } else go('quiz');
};
A.quizBack = () => { if(ui.q.i===0){ go(ui.redo?'me':'profile'); } else { ui.q.i--; go('quiz'); } };
A.finishQuiz = () => {
  if(ui.redo && S.profile){ S.profile.dominant = ui.result; ui.redo=false; }
  else S.profile = {...ui.draft, dominant: ui.result, start: today()};
  save(); go('home');
};
A.redoQuiz = () => { ui.redo = true; ui.q={i:0,ans:[]}; go('quiz'); };
A.editLook = () => { ui.draft = {...defaultDraft(), ...S.profile}; ui.editing = true; go('profile'); };

A.vigil = ({room}) => { if(room==='crypte' && !cryptOpen()) return; ui.v = newVigil(room||null); go('vigil'); };
A.lockedCrypt = () => { toast(`La Crypte s’ouvrira quand ${CRYPT_UNLOCK} bougies brilleront dans le Manoir.`); };
A.pickRoom = ({room}) => { ui.v.room = room; ui.v.step='worry'; go('vigil'); };
A.vstep = ({s}) => {
  const v = ui.v;
  if(s==='whisper' && v.step==='worry' && guard(v.worry)) return;
  if(s==='name' && v.step==='whisper'){
    if(!thoughtOf(v)){ toast('Écris sa phrase ou choisis un murmure.'); return; }
    if(guard(v.typed, v.worry)) return;
    v.named = false; v.demon = null; v.ff = null;
  }
  v.step = s; v.spell = null; go('vigil');
};
A.pickPhrase = ({k}) => {
  const v = ui.v, dom = (S.profile.dominant||[]);
  const ids = [...dom, ...ORDER.filter(i=>!dom.includes(i))];
  const personal = ids.flatMap(id=>S.demons[id].phrases.slice(-2).map(t=>({demon:id,t,personal:true})));
  const presets = ids.slice(0,4).flatMap(id=>DEMONS[id].phrases.slice(0, dom.includes(id)?3:1).map((p,i)=>({demon:id,t:p.t,f:p.f,i})));
  const o = [...personal, ...presets][+k];
  v.pick = o; v.typed = ''; rerender();
};
A.nameDemon = ({id}) => { ui.v.demon = id; ui.v.named = true; buzz(25); rerender(); setTimeout(()=>{ const c=document.querySelector('.card.gold'); c&&c.scrollIntoView({behavior:'smooth',block:'center'}); },60); };
A.spectreAns = ({v:a}) => {
  if(a==='oui'){ ui.v.spectre = true; ui.v.step='spectreFlow'; go('vigil'); }
  else { ui.v.step='duel'; go('vigil'); }
};
A.openSpell = ({k}) => { if(ui.v.cast.includes(k)) return; ui.v.spell=k; ui.v.step='spell'; ui.spellAnim=true; go('vigil'); };
A.ffSort = ({i,v}) => { ui.v.ff.sorted[i]=v; rerender(); };
A.ffCast = () => { ui.v.ff.done = true; buzz([20,40,20]); rerender(); };
A.starter = ({t}) => { const v=ui.v; v.rewrite = (v.rewrite? v.rewrite.trimEnd()+' ' : '') + t; rerender(); const el=document.getElementById('rw'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length);} };
A.soeurCast = () => { const v=ui.v; if(v.rewrite.trim().length<3){ toast('Écris quelques mots avec ta voix de sœur.'); return; } if(guard(v.rewrite)) return; v.soeurDone=true; buzz([20,40,20]); rerender(); };
A.pickProof = ({id}) => { ui.v.proofId = id; ui.v.proofText=''; rerender(); };
A.miroirCast = () => {
  const v=ui.v;
  if(v.proofText.trim()){ if(guard(v.proofText)) return; const p={id:uid(),date:today(),room:v.room,text:v.proofText.trim(),type:'réussite'}; S.proofs.push(p); save(); v.proofId=p.id; }
  if(!v.proofId){ toast('Choisis une page ou écris une preuve.'); return; }
  v.miroirDone = true; buzz([20,40,20]); rerender();
};
A.bal = ({k,d}) => { const b=ui.v.bal; const tot=b.chance+b.aide+b.effort+b.comp; const n=b[k]+(+d); if(n<0 || (+d>0 && tot>=100)) return; b[k]=n; rerender(); };
A.balCast = () => {
  const v=ui.v, b=v.bal;
  if(v.balSave && v.balText.trim()){ if(guard(v.balText)) return; S.proofs.push({id:uid(),date:today(),room:v.room,text:v.balText.trim(),type:'réussite',causes:{...b}}); save(); }
  v.balDone=true; buzz([20,40,20]); rerender();
};
A.castDone = ({k}) => { const v=ui.v; if(!v.cast.includes(k)) v.cast.push(k); v.spell=null; v.step='duel'; ui.hit=true; buzz(40); go('vigil'); };
A.chooseRitual = ({i, sp}) => {
  const v = ui.v; let text;
  if(sp){ text = SPECTRE.rituals[+i]; }
  else if(i==='custom'){ text = v.ritualCustom.trim(); if(!text){ toast('Écris ton rituel, ou choisis-en un.'); return; } if(guard(text)) return; }
  else text = DEMONS[v.demon].rituals[+i];
  if(sp && guard(v.facts)) return;
  const demon = sp ? 'spectre' : v.demon;
  const r = {id:uid(), demon, room:v.room, text, date:today(), status:'pending', note:''};
  S.rituals.push(r);
  const thought = thoughtOf(v);
  if(v.demon && v.typed.trim()){ const ph=S.demons[v.demon].phrases; if(!ph.includes(v.typed.trim())) ph.push(v.typed.trim()); }
  S.vigils.push({date:today(), room:v.room, demon:v.demon, worry:v.worry, thought, spells:[...v.cast], rewrite:v.rewrite, facts:v.facts, spectre:v.spectre, ritualId:r.id});
  if(sp) S.spectre++;
  if(v.demon && !sp) addTame(v.demon, 1);
  S.lastSeen = today(); save();
  ui.lastRitual = text; if(sp) ui.v.demon = ui.v.demon || null;
  buzz([30,60,30]); v.step='end'; go('vigil');
};
A.endVigil = () => { if(ui.famId){ go('familiar'); } else go('home'); };

A.ritualCheck = ({id}) => { ui.rc = {id, status:null, note:'', grim:true, result:null}; go('ritualCheck'); };
A.rcStatus = ({v}) => { ui.rc.status = v; rerender(); };
A.rcSave = () => {
  const c = ui.rc, r = S.rituals.find(x=>x.id===c.id);
  if(guard(c.note)) return;
  const dn = r.demon==='spectre'?SPECTRE.name:DEMONS[r.demon].name;
  if(c.status==='fait'){
    r.status='fait'; r.note=c.note; r.doneDate=today();
    S.rooms[r.room] = (S.rooms[r.room]||0)+1;
    if(r.demon!=='spectre') addTame(r.demon, 2);
    if(c.grim) S.proofs.push({id:uid(),date:today(),room:r.room,text: c.note.trim() ? `${r.text} — ${c.note.trim()}` : `J’ai osé : ${r.text}`,type:'réussite'});
    c.result = r.demon==='spectre' ? 'Tu ne l’as pas affronté seule. C’est exactement comme ça qu’on le combat.' : `Tu l’as fait. ${dn} ${V(DEMONS[r.demon],'rétrécit un peu, et sa voix devient plus faible',null,'rétrécissent un peu, et leurs voix deviennent plus faibles')}.`;
    buzz([30,60,30]);
  } else if(c.status==='pasose'){
    r.status='pasose'; r.note=c.note; r.doneDate=today();
    if(r.demon!=='spectre') addTame(r.demon, 1);
    c.result = 'Tu as regardé ce qui bloque. Ça compte aussi : la prochaine fois, le pas sera plus petit.';
  } else {
    r.date = today();
    c.result = 'Le rituel reste dans ta poche. Rien n’est perdu, la flamme attend.';
  }
  S.lastSeen = today(); save(); rerender();
};
A.afterCheck = () => { if(ui.famId) go('familiar'); else go('home'); };

A.newProof = () => { ui.pf = {type:'réussite', room:'', text:''}; go('proofForm'); };
A.pfType = ({v}) => { ui.pf.type = v; rerender(); };
A.saveProof = () => { const f=ui.pf; if(!f.text.trim()){ toast('Écris ta preuve.'); return; } if(guard(f.text)) return;
  S.proofs.push({id:uid(),date:today(),room:f.room,text:f.text.trim(),type:f.type}); S.lastSeen=today(); save(); buzz(25); go('grimoire'); };
A.delProof = ({id}) => { if(confirm('Retirer cette page du Grimoire ?')){ S.proofs = S.proofs.filter(p=>p.id!==id); save(); rerender(); } };

A.demon = ({id}) => { ui.demonId = id; go('demon'); };
A.toggle = ({k}) => { S.settings[k] = !S.settings[k]; save(); rerender(); };
A.exportData = () => {
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `nocturne-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
A.wipe = () => { if(confirm('Effacer toutes tes données (Grimoire, démons, rituels, Manoir) ? Impossible à annuler.')){ localStorage.removeItem(KEY); S = blank(); go('welcome'); } };
A.resumeDistress = () => { go(ui.distressFrom && ui.distressFrom!=='distress' ? ui.distressFrom : 'home'); };

function addTame(id, n){
  const d = S.demons[id]; if(!d) return;
  d.tame = Math.min(TAME_MAX, d.tame + n);
  if(d.tame >= TAME_MAX && !d.familiar){ d.familiar = true; ui.famId = id; }
}

/* ============================================================
   RENDU
   ============================================================ */
const app = document.getElementById('app');
const MAIN = {home:'home', grimoire:'grim', proofForm:'grim', bestiary:'best', demon:'best', me:'me'};
function shell(inner){
  const onb = !S.profile;
  const tab = MAIN[ui.screen];
  return `<header class="top"><span class="brand">Nocturne</span><button class="talk" data-a="go" data-to="help">Parler à quelqu’un</button></header>
  <main class="screen">${inner}</main>
  ${!onb && tab ? `<nav class="nav" aria-label="Navigation">
    ${[['home','home','Manoir'],['grimoire','grim','Grimoire'],['bestiary','best','Bestiaire'],['me','me',esc(S.profile.name)]].map(([s,ic,l])=>`<button class="${tab===ic?'on':''}" data-a="go" data-to="${s}">${NAVICON[ic]}<span>${l}</span></button>`).join('')}
  </nav>`:''}
  <div id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:420px;width:calc(100% - 36px);background:#2e1d34;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;display:none;z-index:30"></div>`;
}
function rerender(){
  if(ui.screen==='famId') return;
  document.body.classList.toggle('calm', !!S.settings.calm);
  document.body.classList.toggle('onb', !S.profile);
  const y = window.scrollY;
  app.innerHTML = shell(SCREENS[ui.screen]());
  window.scrollTo(0,y);
}
function go(s){
  if(s==='familiar'){ ui.screen='familiar'; }
  if(s==='home' && ui.famId && ui.screen==='familiar'){ ui.famId=null; }
  if(s!==ui.screen) ui.prev = ui.screen;
  if(!S.profile && !['welcome','profile','quiz','quizResult','help','distress'].includes(s)) s='welcome';
  ui.screen = s;
  rerender(); window.scrollTo(0,0);
}
let toastT;
function toast(msg){ const t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',2600); }

function setPath(obj, path, val){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=val; }
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const fn = A[el.dataset.a]; if(fn){ e.preventDefault(); fn({...el.dataset}, el); }
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.page[data-a]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e=>{
  const el = e.target;
  if(el.dataset.bind){
    const path = el.dataset.bind.replace(/^v\./,'').replace(/^rc\./,'').replace(/^pf\./,'').replace(/^draft\./,'');
    const root = el.dataset.bind.split('.')[0];
    setPath(ui[root], path, el.type==='checkbox'?el.checked:el.value);
  }
  if(el.dataset.filter!==undefined){
    const q = norm(el.value.trim()); let n=0;
    document.querySelectorAll('#pages .page').forEach(p=>{ const ok = !q || p.dataset.text.includes(q); p.style.display = ok?'':'none'; if(ok) n++; });
    const nr=document.getElementById('nores'); if(nr) nr.style.display = (n===0 && S.proofs.length)?'block':'none';
  }
});
document.addEventListener('change', e=>{ if(e.target.type==='checkbox' && e.target.dataset.bind){ e.target.dispatchEvent(new Event('input',{bubbles:true})); } });

/* ---------- PWA : installation, hors ligne, stockage durable ---------- */
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if(ui.screen==='me') rerender(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('NOCTURNE est sur ton écran d’accueil.'); if(ui.screen==='me') rerender(); });
function installCard(){
  if(isStandalone()) return `<div class="banner" style="margin-top:16px">NOCTURNE est installé et marche hors ligne.</div>`;
  if(installEvt) return `<h3 style="margin-top:20px">Sur ton écran d’accueil</h3><button class="btn block goldb" data-a="install">Installer NOCTURNE</button><p class="small muted">Il s’ouvrira comme une app et marchera hors ligne.</p>`;
  if(isIOS()) return `<h3 style="margin-top:20px">Sur ton écran d’accueil</h3><div class="card"><p style="margin:0">Dans Safari, touche le bouton <b>Partager</b> (le carré avec une flèche), puis <b>Sur l’écran d’accueil</b>.</p></div>`;
  return `<h3 style="margin-top:20px">Sur ton écran d’accueil</h3><p class="small muted">Dans le menu de ton navigateur, choisis « Installer l’application » ou « Ajouter à l’écran d’accueil ».</p>`;
}
A.install = async () => { if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt = null; rerender(); };
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

if(S.profile){ S.lastSeen = S.lastSeen || today(); }
rerender();
window.addEventListener('beforeunload', ()=>{ if(S.profile){ S.lastSeen = today(); save(); } });
</script>
</body>
</html>
